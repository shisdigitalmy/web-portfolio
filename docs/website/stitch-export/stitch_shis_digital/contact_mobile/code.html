<body class="bg-background text-on-background antialiased md:hidden pb-32">
<!-- Mobile Top Header -->
<header class="flex justify-between items-center h-20 px-margin w-full bg-surface/80 backdrop-blur-md shadow-sm sticky top-0 z-50">
<a class="font-headline-md text-headline-md font-bold text-on-surface" href="#">SHIS Digital</a>

</button>
</header>
<!-- Main Content -->
<main class="px-margin pt-lg pb-xl">
<!-- Header -->
<div class="mb-lg">
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface mb-sm">Let's Talk.</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Ready to scale your business? Fill out the form below or reach out directly.</p>
</div>
<!-- Contact Form -->
<form class="space-y-md mb-xl bg-surface-container-lowest p-md rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.06)] border border-outline-variant/30">
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-xs" for="name">Full Name</label>
<input class="w-full h-12 px-sm rounded-lg border border-outline-variant/50 bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface outline-none" id="name" name="name" placeholder="Jane Doe" type="text"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-xs" for="email">Work Email</label>
<input class="w-full h-12 px-sm rounded-lg border border-outline-variant/50 bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface outline-none" id="email" name="email" placeholder="jane@company.com" type="email"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-xs" for="service">Interested In</label>
<select class="w-full h-12 px-sm rounded-lg border border-outline-variant/50 bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface outline-none appearance-none" id="service" name="service">
<option disabled="" selected="" value="">Select a service...</option>
<option value="seo">Local SEO</option>
<option value="web">Web Development</option>
<option value="ads">Paid Advertising</option>
<option value="other">Other</option>
</select>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-xs" for="message">Project Details</label>
<textarea class="w-full p-sm rounded-lg border border-outline-variant/50 bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface outline-none resize-none" id="message" name="message" placeholder="Tell us about your goals..." rows="4"></textarea>
</div>
<button class="w-full h-14 bg-on-surface text-on-primary rounded-lg font-label-sm text-label-sm font-bold flex items-center justify-center gap-2 hover:bg-on-surface-variant transition-colors shadow-sm" type="submit">
                Submit Request
                <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<!-- Direct Contact Info -->
<div class="space-y-md">
<h2 class="font-headline-md text-headline-md text-on-surface mb-md">Direct Contact</h2>
<a class="flex items-start gap-4 p-md bg-surface-container-low rounded-lg border border-outline-variant/30 hover:bg-surface-container transition-colors" href="mailto:hello@shisdigital.com">
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">mail</span>
</div>
<div>
<h3 class="font-label-sm text-label-sm font-bold text-on-surface">Email Us</h3>

</a>
<div class="flex items-start gap-4 p-md bg-surface-container-low rounded-lg border border-outline-variant/30">
